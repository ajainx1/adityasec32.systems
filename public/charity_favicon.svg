<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    
    <g id="paw">
      <path d="M50 45 C20 45 5 65 15 85 C25 105 50 95 50 95 C50 95 75 105 85 85 C95 65 80 45 50 45 Z" />
      <circle cx="15" cy="35" r="12" />
      <circle cx="35" cy="15" r="14" />
      <circle cx="65" cy="15" r="14" />
      <circle cx="85" cy="35" r="12" />
    </g>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="140" fill="url(#bgGradient)" filter="url(#dropShadow)" />
  <rect x="32" y="32" width="448" height="448" rx="140" fill="url(#innerGlow)" />
  <rect x="34" y="34" width="444" height="444" rx="138" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-opacity="0.6" />

  <g fill="#374151" filter="url(#dropShadow)">
    <use href="#paw" x="0" y="0" transform="translate(130, 150) rotate(-20) scale(1.3)" />
    <use href="#paw" x="0" y="0" transform="translate(250, 250) rotate(5) scale(1.5)" />
  </g>
  
  <ellipse cx="140" cy="80" rx="60" ry="20" fill="#ffffff" opacity="0.15" transform="rotate(-20 140 80)" />
</svg>
